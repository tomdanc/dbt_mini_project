version: 2

models:
  - name: FCT_ORDER_ITEMS
    columns:
      - name: item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('FCT_ORDERS')
                field: order_id

      - name: sku
        data_tests:
          - relationships:
              arguments:
                to: ref('DIM_PRODUCTS')
                field: sku
              config:
                severity: warn